<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab and Fetch Plugin</title>

    <style>
      .message {
        color: #123;
        margin-bottom: 6px;
      }
      .message.error {
        color: red;
      }

      .container {
        width: 100px;
        display: flex;
        flex-direction: column;
      }

      .container .button {
        margin-top: 6px;
        border-radius: 5px;
        background: #456;
        color: white;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }

      .container .button:hover {
        background: #678;
      }

      .container .button:active {
        background: #567;
      }
    </style>
  </head>

  <body>
    <div class="message" id="message"></div>
    <div class="container">
      <input type="text" id="jira-branch-input" placeholder="英文名字" />
      <div class="button" id="jira-branch-btn">從 Jira 產生 branch name</div>
    </div>
  </body>
  <script src="popup.js"></script>
</html>
