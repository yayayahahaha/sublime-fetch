<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab and Fetch Plugin</title>

    <style>
      .message {
        color: #123;
        margin-bottom: 6px;
      }

      .message.error {
        color: red;
      }

      .container {
        width: 500px;
        display: flex;
        flex-direction: column;
      }

      .container .button {
        margin-top: 6px;
        border-radius: 5px;
        background: #456;
        color: white;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }

      .container .button:hover {
        background: #678;
      }

      .container .button:active {
        background: #567;
      }

      table td {
        text-align: center;
        padding: 12px 0;
      }

      .icon-container {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        gap: 6px;
      }

      .icon {
        cursor: pointer;
        font-size: 24px;
        box-shadow: 1px 1px 2px 2px #9ab;
      }

      [demo-field] {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="message" id="message"></div>
    <div class="container">
      <input type="text" id="jira-branch-input" placeholder="英文名字" />
      <div class="button" id="jira-branch-btn">從 Jira 產生 branch name</div>

      <div>---</div>

      <h3>快速登入</h3>
      <!-- <button id="quick-login-test">測試用</button> -->
      <!-- TODO(flyc): 這裡要改成透過呼叫 api 取得 -->
      <button class="quick-login" pk="btse-staging">登入 btse-staging</button>
      <button class="quick-login" pk="paradise-staging">登入 paradise-staging</button>
      <button class="quick-login" pk="bitmarkets-staging">登入 bitmarkets-staging</button>
      <button class="quick-login" pk="bitmarkets1-staging">登入 bitmarkets1-staging</button>
      <button class="quick-login" pk="b2z-staging">登入 b2z-staging</button>
      <button class="quick-login" pk="lmex-staging">登入 lmex-staging</button>
      <button class="quick-login" pk="interpay-staging">登入 interpay-staging</button>
      <button class="quick-login" pk="trans-staging">登入 trans-staging</button>
      <button class="quick-login" pk="bullstreetex-staging">登入 bullstreetex-staging</button>
      <button class="quick-login" pk="btse-gi-staging">登入 btse-gi-staging</button>
      <button class="quick-login" pk="btse-lt-staging">登入 btse-lt-staging</button>
      <button class="quick-login" pk="altex-staging">登入 altex-staging</button>
      <button class="quick-login" pk="crypto-staging">登入 crypto-staging</button>
      <button class="quick-login" pk="btse-li-staging">登入 btse-li-staging</button>
      <button class="quick-login" pk="binoex-staging">登入 binoex-staging</button>
      <button class="quick-login" pk="nvx-staging">登入 nvx-staging</button>
      <button class="quick-login" pk="traiex-staging">登入 traiex-staging</button>
      <button class="quick-login" pk="autotrader-staging">登入 autotrader-staging</button>
      <button class="quick-login" pk="bitkub-staging">登入 bitkub-staging</button>
      <button class="quick-login" pk="bitqik-staging">登入 bitqik-staging</button>
      <button class="quick-login" pk="coinwise-staging">登入 coinwise-staging</button>
      <button class="quick-login" pk="obot-staging">登入 obot-staging</button>
      <button class="quick-login" pk="fedhabit-staging">登入 fedhabit-staging</button>
      <button class="quick-login" pk="btzo-staging">登入 btzo-staging</button>
      <button class="quick-login" pk="traxex-staging">登入 traxex-staging</button>
      <button class="quick-login" pk="lmex-staging">登入 lmex-staging</button>
      <button class="quick-login" pk="traiex-staging">登入 traiex-staging</button>

      <div>---</div>

      <h3>取得與儲存當前畫面 token</h3>
      <button id="exort-token">exort</button>
      <table token>
        <thead>
          <tr>
            <th>brand name</th>
            <th>Behavior</th>
          </tr>
        </thead>
        <tbody>
          <tr demo-field>
            <td name-field>
              <input type="text" />
            </td>
            <td behavior-field>
              <div class="icon-container">
                <div class="icon icon-delete">🗡️</div>
                <div class="icon icon-set">🌠</div>
                <div class="icon icon-take">🙌</div>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <div id="copy-token" class="icon icon-add">➕</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
  <script src="popup.js"></script>
</html>
