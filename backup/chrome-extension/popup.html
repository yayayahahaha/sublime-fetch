<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Tab and Fetch Plugin</title>

    <style>
      .message {
        color: #123;
        margin-bottom: 6px;
      }

      .message.error {
        color: red;
      }

      .container {
        width: 500px;
        display: flex;
        flex-direction: column;
      }

      .container .button {
        margin-top: 6px;
        border-radius: 5px;
        background: #456;
        color: white;
        text-align: center;
        padding: 5px;
        cursor: pointer;
      }

      .container .button:hover {
        background: #678;
      }

      .container .button:active {
        background: #567;
      }

      table td {
        text-align: center;
        padding: 12px 0;
      }

      .icon-container {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        gap: 6px;
      }

      .icon {
        cursor: pointer;
        font-size: 24px;
        box-shadow: 1px 1px 2px 2px #9ab;
      }

      [demo-field] {
        display: none;
      }
    </style>
  </head>

  <body>
    <div class="message" id="message"></div>
    <div class="container">
      <input type="text" id="jira-branch-input" placeholder="英文名字" />
      <div class="button" id="jira-branch-btn">從 Jira 產生 branch name</div>

      <div>---</div>

      <h3>快速登入</h3>
      <!-- <button id="quick-login-test">測試用</button> -->
      <button class="quick-login" pk="fc">登入 lmex</button>
      <button class="quick-login" pk="matoi">登入 traiex</button>

      <div>---</div>

      <h3>取得與儲存當前畫面 token</h3>
      <button id="exort-token">exort</button>
      <table token>
        <thead>
          <tr>
            <th>brand name</th>
            <th>Behavior</th>
          </tr>
        </thead>
        <tbody>
          <tr demo-field>
            <td name-field>
              <input type="text" />
            </td>
            <td behavior-field>
              <div class="icon-container">
                <div class="icon icon-delete">🗡️</div>
                <div class="icon icon-set">🌠</div>
                <div class="icon icon-take">🙌</div>
              </div>
            </td>
          </tr>
          <tr>
            <td colspan="2">
              <div id="copy-token" class="icon icon-add">➕</div>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </body>
  <script src="popup.js"></script>
</html>
